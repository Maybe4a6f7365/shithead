name: Multiplayer CI and Production Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:worker
      - run: npm run build
      - name: Install WebSocket adversarial-test client
        run: npm install --no-save --no-package-lock ws@8
      - name: Exercise the local Worker adversarially
        shell: bash
        run: |
          npm run worker:dev -- --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then
              if ! BASE_URL=http://127.0.0.1:8787 npm run test:worker:adversarial; then
                cat "$RUNNER_TEMP/wrangler.log"
                exit 1
              fi
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wrangler.log"
              exit 1
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

  production-smoke:
    name: Verify deployed multiplayer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json
      - run: npm ci
      - name: Install WebSocket smoke-test client
        run: npm install --no-save --no-package-lock ws@8
      - name: Exercise production multiplayer end to end
        run: node scripts/smoke-multiplayer.mjs
        env:
          BASE_URL: https://shithead.not4a6f7365.workers.dev
          EXPECTED_COMMIT: ${{ github.sha }}
          DEPLOYMENT_TIMEOUT_MS: '600000'
