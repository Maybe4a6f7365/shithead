# Local-development copy for `wrangler dev` / `wrangler deploy` run from app/.
# The repository-root wrangler.toml is authoritative: Cloudflare Workers Builds
# deploys from the repo root with that file. Keep this file in sync with it —
# only `main` and `[assets].directory` differ (paths relative to app/).
name = "shithead"
main = "src/worker/index.ts"
compatibility_date = "2026-08-08"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
