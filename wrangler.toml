# ============================================================================
# Shithead — Cloudflare Workers (root config for CF Git integration)
# CF runs `npx wrangler deploy` from the REPO ROOT, so config goes here.
# The build command installs deps + builds PWA into app/dist, then deploys
# the Worker (which serves the static assets via the ASSETS binding).
# ============================================================================
name = "shithead"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
main = "app/src/worker/index.ts"

# Build the PWA before deploying
[build]
command = "cd app && npm install && npm run build"

# Static assets (built PWA)
[assets]
directory = "./app/dist"
binding = "ASSETS"

# Durable Object for game rooms
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://shithead.pages.dev,https://shithead.not4a6f7365.workers.dev,http://localhost:5173"
